<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sunrise 抽選歷史</title>

    <link
        rel="stylesheet"
        href="history.css"
    >
</head>

<body>
    <header class="page-header">
        <div class="header-content">
            <a
                class="back-link"
                href="../"
            >
                ← 返回管理中心
            </a>

            <h1>📜 火車抽選歷史</h1>

            <p>
                查看 Sunrise 歷次火車資格抽選結果
            </p>
        </div>
    </header>

    <main class="page-content">
        <section class="card">
            <div class="toolbar">
                <div>
                    <h2>歷史紀錄</h2>

                    <p id="summaryText">
                        正在載入抽選紀錄……
                    </p>
                </div>

                <button
                    id="reloadButton"
                    type="button"
                >
                    重新整理
                </button>
            </div>

            <div class="filter-area">
                <label>
                    搜尋中獎成員

                    <input
                        id="searchInput"
                        type="search"
                        placeholder="輸入成員名稱"
                    >
                </label>
            </div>

            <p
                id="message"
                class="message"
            ></p>

            <div
                id="loadingMessage"
                class="loading-message"
            >
                正在載入抽選紀錄……
            </div>

            <div
                id="historyList"
                class="history-list"
            ></div>
        </section>
    </main>

    <footer>
        Sunrise Alliance
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../train/config.js"></script>

    <script src="history.js"></script>
</body>
</html>
