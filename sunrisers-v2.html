<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunrise V2</title>
<link rel="manifest" href="manifest-v2.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1a73e8">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Microsoft JhengHei",sans-serif;background:#f0f2f5;color:#333;line-height:1.5;overflow-x:hidden}.wrap{width:min(900px,calc(100% - 24px));margin:auto;padding:18px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.top a{color:#1a73e8;text-decoration:none;font-weight:700}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.actions select{padding:7px 11px;border:1px solid #ccd3dc;border-radius:12px;background:#fff;font:inherit}.box{margin:12px 0;padding:14px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}h3{font-size:1.08em;margin:0 0 10px;color:#1a73e8;border-left:4px solid #1a73e8;padding-left:8px}.inner-duty{background:#f8f9fa;padding:11px;border-radius:9px;border-left:5px solid #ffc107}.inner-line{margin:7px 0}.duty{font-weight:700;color:#d63384}.internal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.internal-btn,.top-install-btn{display:inline-flex;align-items:center;justify-content:center;padding:6px 11px;border:none;border-radius:14px;text-decoration:none;font-weight:700;font-size:13px;cursor:pointer}.settings-btn{background:#6c757d;color:#fff}.top-install-btn{background:#34a853;color:#fff;display:none}.red{color:#d93025;font-weight:700}.green{color:#188038;font-weight:700}.gold{color:#d4af37;font-weight:700}.purple{color:#a333c8;font-weight:700}.event-text{color:#e67e22;font-weight:700}.note-text{color:#666;font-weight:700}.today-row{background:#fff9c4;display:block;padding:7px 8px;border-radius:6px;border:1px solid #fbc02d;margin:5px 0}.shield-alert{background:#d93025;color:#fff;padding:2px 7px;border-radius:4px;font-weight:700;display:inline-block;margin-top:2px;font-size:.9em;animation:blink 1s infinite}@keyframes blink{50%{opacity:.68}}hr{border:0;border-top:1px solid #eee;margin:9px 0}#zone,#strategy{font-size:.96em;word-break:break-word}#trainDriver{white-space:pre-line;display:inline-block;vertical-align:top}
#custom-splash{position:fixed;inset:0;background:#f0f2f5;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:99999;transition:opacity .45s ease}.splash-icon{width:120px;height:120px;border-radius:25px;box-shadow:0 4px 15px rgba(0,0,0,.1);margin-bottom:20px;object-fit:cover}.splash-loader{width:30px;height:30px;border:3px solid #ccc;border-top-color:#1a73e8;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.splash-text{margin-top:15px;color:#666;font-weight:700}
@media(max-width:600px){.top{align-items:flex-start}.actions{max-width:72%;gap:6px}.actions select{max-width:130px}.top-install-btn{padding:6px 9px}.internal-actions{width:100%}.internal-btn{flex:1;min-width:0}}
</style>
</head>
<body>
<div id="custom-splash"><img id="splashImage" class="splash-icon" alt="Sunrisers"><div class="splash-loader"></div><p class="splash-text">Loading Strategy...</p></div>
<main class="wrap">
<div class="top"><a href="index.html" data-i18n="sunV2.back">← Back to Management</a><div class="actions"><button id="installBtn" class="top-install-btn" type="button">📲 Install</button><select data-language-select aria-label="Language" onchange="ChangeSunriseLanguage(this.value)"><option value="">Language</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select></div></div>
<div class="box"><h3 data-i18n="sunV2.internal">🏠 Sunrise Internal</h3><div class="inner-duty"><div class="inner-line"><strong data-i18n="sunV2.duty">On Duty:</strong> <span id="dutyList" class="duty">Loading...</span></div><div class="inner-line"><strong data-i18n="sunV2.train">Train Driver:</strong> <span id="trainDriver" class="duty">Loading...</span></div><div class="internal-actions"><a id="internalRosterLink" class="internal-btn settings-btn" href="duty-settings/">Internal Roster Settings</a></div></div></div>
<div class="box"><h3 data-i18n="sunV2.zoneTitle">🔴 Red Star Zone Info</h3><div id="zone">Loading...</div></div>
<div class="box"><h3 data-i18n="sunV2.strategyTitle">📅 7-Day Strategy</h3><div id="strategy">Loading...</div></div>
</main>
<script>
(function(){
 const img=document.getElementById('splashImage'),splash=document.getElementById('custom-splash'),url='apple-touch-icon.png',cacheName='sunrise-splash-v1';
 async function loadSplash(){try{if('caches'in window){const cache=await caches.open(cacheName);let response=await cache.match(url);if(!response){response=await fetch(url,{cache:'no-cache'});if(response.ok)await cache.put(url,response.clone());}if(response&&response.ok){const blob=await response.blob();img.src=URL.createObjectURL(blob);return;}}}catch(e){console.warn('Splash cache unavailable',e);}img.src=url;}
 loadSplash();window.addEventListener('load',function(){setTimeout(function(){splash.style.opacity='0';setTimeout(function(){splash.remove();},480);},300);});
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/i18next@26/i18next.min.js"></script><script src="train/config.js"></script><script src="shared/language-ui.js"></script><script src="shared/i18n.js"></script><script src="sunrisers-v2.js?v=20261004-0336"></script>
<script>
(function(){
 var deferredPrompt=null,installBtn=document.getElementById('installBtn'),rosterLink=document.getElementById('internalRosterLink');
 function lang(){return(window.i18next&&i18next.language)||'en';}
 function labels(){var all={'zh-TW':{settings:'內務名單設定',install:'📲 安裝到桌面',ios:"iOS 使用者請點擊瀏覽器下方的『分享』按鈕，然後選擇『加入主畫面』。"},en:{settings:'Internal Roster Settings',install:'📲 Install',ios:"iOS: Tap 'Share' and 'Add to Home Screen'."},vi:{settings:'Cài đặt danh sách nội bộ',install:'📲 Cài đặt',ios:"iOS: Nhấn 'Chia sẻ' và 'Thêm vào màn hình chính'."}};return all[lang()]||all.en;}
 function applyLabels(){var t=labels();if(rosterLink)rosterLink.textContent=t.settings;if(installBtn)installBtn.textContent=t.install;}
 function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;}
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(function(e){console.error('Service worker registration failed',e);});
 window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;if(installBtn&&!isStandalone())installBtn.style.display='inline-flex';});window.addEventListener('appinstalled',function(){deferredPrompt=null;if(installBtn)installBtn.style.display='none';});document.addEventListener('DOMContentLoaded',function(){applyLabels();if(installBtn&&isIOS()&&!isStandalone())installBtn.style.display='inline-flex';});document.addEventListener('sunriseLanguageChanged',applyLabels);if(installBtn)installBtn.addEventListener('click',async function(){var t=labels();if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice;}finally{deferredPrompt=null;installBtn.style.display='none';}}else alert(t.ios);});
})();
</script>
</body></html>
