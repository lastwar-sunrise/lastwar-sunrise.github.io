<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sunrise 管理中心</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Arial,
                "Microsoft JhengHei",
                sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #fff7df,
                    #ffe6a7
                );
            color: #31260f;
        }

        .page-header {
            padding: 48px 20px 30px;
            text-align: center;
        }

        .page-header h1 {
            margin: 0 0 10px;
            font-size: 36px;
        }

        .page-header p {
            margin: 0;
            color: #74633d;
        }

        .menu {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }

        .menu-card {
            display: block;
            padding: 28px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.92);
            color: inherit;
            text-decoration: none;
            box-shadow:
                0 10px 30px rgba(105, 77, 13, 0.12);
            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow:
                0 14px 36px rgba(105, 77, 13, 0.18);
        }

        .menu-icon {
            display: block;
            margin-bottom: 14px;
            font-size: 42px;
        }

        .menu-card h2 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .menu-card p {
            margin: 0;
            line-height: 1.6;
            color: #74633d;
        }

        .coming-soon {
            opacity: 0.55;
            pointer-events: none;
        }

        footer {
            padding: 20px;
            text-align: center;
            color: #8b7953;
        }
    </style>
</head>

<body>
    <header class="page-header">
        <h1>☀️ Sunrise 管理中心</h1>
        <p>Sunrise Alliance Management Tools</p>
    </header>

    <main class="menu">
        <a
            class="menu-card"
            href="train/"
        >
            <span class="menu-icon">🚂</span>

            <h2>火車資格抽選</h2>

            <p>
                建立每週資格名單並進行正式抽選。
            </p>
        </a>

        <a
            class="menu-card"
            href="members/"
        >
            <span class="menu-icon">👥</span>

            <h2>成員管理</h2>

            <p>
                新增、修改、啟用或停用聯盟成員。
            </p>
        </a>

<a
    class="menu-card"
    href="history/"
>
    <span class="menu-icon">📜</span>

    <h2>抽選歷史</h2>

    <p>
        查看過去每一週的火車資格抽選結果。
    </p>
</a>

        <div class="menu-card coming-soon">
            <span class="menu-icon">⚙️</span>

            <h2>系統設定</h2>

            <p>
                帳號、角色與系統設定，即將推出。
            </p>
        </div>
    </main>

    <footer>
        Sunrise Alliance
    </footer>
</body>
</html>
