<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunrise V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Microsoft JhengHei",sans-serif;background:#f0f2f5;color:#333;line-height:1.5}.wrap{width:min(900px,calc(100% - 24px));margin:auto;padding:18px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.top a{color:#1a73e8;text-decoration:none;font-weight:700}.actions{display:flex;gap:8px;align-items:center}.actions select,.actions a{padding:7px 11px;border:1px solid #ccd3dc;border-radius:12px;background:#fff;font:inherit}.box{margin:12px 0;padding:14px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}h3{font-size:1.08em;margin:0 0 10px;color:#1a73e8;border-left:4px solid #1a73e8;padding-left:8px}.inner-duty{background:#f8f9fa;padding:11px;border-radius:9px;border-left:5px solid #ffc107}.inner-line{margin:7px 0}.duty{font-weight:700;color:#d63384}.red{color:#d93025;font-weight:700}.green{color:#188038;font-weight:700}.gold{color:#d4af37;font-weight:700}.purple{color:#a333c8;font-weight:700}.event-text{color:#e67e22;font-weight:700}.note-text{color:#666;font-weight:700}.today-row{background:#fff9c4;display:block;padding:7px 8px;border-radius:6px;border:1px solid #fbc02d;margin:5px 0}.shield-alert{background:#d93025;color:white;padding:2px 7px;border-radius:4px;font-weight:700;display:inline-block;margin-top:2px;font-size:.9em;animation:blink 1s infinite}@keyframes blink{50%{opacity:.68}}hr{border:0;border-top:1px solid #eee;margin:9px 0}#zone,#strategy{font-size:.96em;word-break:break-word}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions select{flex:1}.actions a{white-space:nowrap}}
</style>
</head>
<body><main class="wrap">
<div class="top"><a href="index.html" data-i18n="sunV2.back">← 返回管理中心</a><div class="actions"><a href="duty-settings/">內務名單設定</a><select data-language-select onchange="ChangeSunriseLanguage(this.value)"><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select></div></div>
<div class="box"><h3 data-i18n="sunV2.internal">🏠 Sunrise 內務</h3><div class="inner-duty"><div class="inner-line"><strong data-i18n="sunV2.duty">值日生：</strong> <span id="dutyList" class="duty">Loading...</span></div><div class="inner-line"><strong data-i18n="sunV2.train">駕駛火車：</strong> <span id="trainDriver" class="duty">Loading...</span></div></div></div>
<div class="box"><h3 data-i18n="sunV2.zoneTitle">🔴 紅星戰區資訊 (當前)</h3><div id="zone">Loading...</div></div>
<div class="box"><h3 data-i18n="sunV2.strategyTitle">📅 近七日策略</h3><div id="strategy">Loading...</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/i18next@26/i18next.min.js"></script><script src="train/config.js"></script><script src="shared/i18n.js"></script><script src="sunrisers-v2.js?v=20261004-0210"></script>
</body></html>
