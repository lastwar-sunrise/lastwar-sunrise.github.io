<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duty Settings</title><style>*{box-sizing:border-box}body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#fff7df;margin:0;color:#31260f}.wrap{width:min(900px,calc(100% - 24px));margin:auto;padding:20px}.box{background:#fff;padding:18px;border-radius:16px;margin:12px 0;box-shadow:0 8px 24px #69500d18}input,button,select{padding:9px;border:1px solid #ccb878;border-radius:9px}button{cursor:pointer}.member{display:inline-flex;gap:5px;margin:4px;padding:7px;background:#fff7df;border-radius:8px}.group{border:1px solid #ead79f;padding:10px;border-radius:10px;margin:8px 0}.hidden{display:none}.train-row{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;margin:8px 0}.train-row select{width:100%}</style></head><body><main class="wrap"><a href="../sunrisers-v2.html">← Sunrise V2</a><div class="box"><h2>值日生 / 火車設定</h2><div id="login"><input id="account" placeholder="帳號"><input id="password" type="password" placeholder="密碼"><button id="loginBtn">登入</button></div><div id="status"></div></div><div id="editor" class="hidden"><div class="box"><h3>值日生輪替群組（每組可多人）</h3><label>基準週 <input id="anchor" type="date"></label><div id="groups"></div><button id="addGroup">＋新增一週群組</button><button id="save">儲存輪替</button></div><div class="box"><h3>本週值日生 override</h3><div id="overrideMembers"></div><button id="saveOverride">儲存本週調整</button><button id="clearOverride">恢復自動輪替</button></div><div class="box"><h3>本週火車順序</h3><p>原始抽選結果不會被修改；這裡只調整本週週一到週六的顯示順序。週日固定顯示 MVP。</p><div id="trainSchedule"></div><button id="saveTrainOverride">儲存火車順序</button><button id="clearTrainOverride">恢復原始抽選順序</button></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../train/config.js"></script><script src="../shared/auth-helper.js"></script><script src="duty-settings.js?v=20261004-0210"></script></body></html>
