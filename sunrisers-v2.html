<html lang="zh-TW">
<head>

<title>Sunrise V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f0f2f5;color:#333}.wrap{width:min(900px,calc(100% - 24px));margin:auto;padding:18px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:#1a73e8;text-decoration:none;font-weight:700}.actions{display:flex;gap:8px;align-items:center}.actions select,.actions a{padding:8px 10px;border:1px solid #ccc;border-radius:10px;background:#fff}.box{margin:12px 0;padding:16px;background:#fff;border-radius:14px;box-shadow:0 2px 10px #0000000d}h3{margin:0 0 10px;color:#1a73e8}.duty{font-weight:700;color:#d63384}.row{padding:7px 8px;border-radius:7px}.today{background:#fff9c4;border:1px solid #fbc02d}.red{color:#d93025;font-weight:700}.green{color:#188038;font-weight:700}.gold{color:#b8860b;font-weight:700}.purple{color:#8e44ad;font-weight:700}.event{color:#e67e22;font-weight:700}.note{color:#666;font-weight:700}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions select{flex:1}}

<div class="box"><h3 data-i18n="sunV2.strategyTitle">📅 近七日策略</h3><div id="strategy">Loading...</div></div>
</main>
