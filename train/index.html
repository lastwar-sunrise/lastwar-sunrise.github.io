<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sunrise 火車資格抽選</title>

    <link rel="stylesheet" href="train.css">
</head>

<body>
    <header class="page-header">
    <div>
        <a class="back-link" href="../">
            ← 返回管理中心
        </a>

        <h1>🚂 Sunrise 火車資格抽選</h1>
        <p>由當週值日 R4 勾選合格成員並進行正式抽選</p>
    </div>

        <div id="loginStatus" class="login-status">
            尚未登入
        </div>
    </header>

    <main class="page-content">
        <!-- R4 登入 -->
        <section class="card">
            <div class="section-title">
                <h2>R4 登入</h2>
            </div>

            <div id="loginForm" class="login-form">
                <label>
    帳號
    <input
        id="emailInput"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        placeholder="例如：kindsun"
    >
</label>

                <label>
                    密碼
                    <input
                        id="passwordInput"
                        type="password"
                        autocomplete="current-password"
                        placeholder="請輸入密碼"
                    >
                </label>

                <button
                    id="loginButton"
                    type="button"
                >
                    登入
                </button>
            </div>

            <div id="logoutArea" class="hidden">
                <button
                    id="logoutButton"
                    type="button"
                    class="secondary-button"
                >
                    登出
                </button>
            </div>

            <p id="loginMessage" class="message"></p>
        </section>

        <!-- 本週抽選設定 -->
        <section class="card">
            <div class="section-title">
                <div>
                    <h2>本週抽選設定</h2>
                    <p>建立或載入指定週次的火車抽選</p>
                </div>
            </div>

            <div class="draw-controls">
                <label>
                    週次開始日
                    <input
                        id="weekStartInput"
                        type="date"
                    >
                </label>

                <label>
                    抽選名額
                    <input
                        id="weekDrawCountInput"
                        type="number"
                        min="1"
                        value="1"
                    >
                </label>

                <button
                    id="loadWeekButton"
                    type="button"
                >
                    載入週次
                </button>

                <button
                    id="saveWeekButton"
                    type="button"
                    class="secondary-button"
                >
                    儲存本週資格
                </button>
            </div>

            <p id="weekMessage" class="message"></p>

            <div class="summary">
                目前週次：
                <strong id="currentWeekText">
                    尚未載入
                </strong>

                <span class="separator">｜</span>

                狀態：
                <strong id="currentWeekStatus">
                    －
                </strong>
            </div>
        </section>

        <!-- 合格成員名單 -->
        <section class="card">
            <div class="section-title">
                <div>
                    <h2>本週合格成員</h2>
                    <p>請根據本週資格條件勾選合格成員</p>
                </div>

                <button
                    id="reloadButton"
                    type="button"
                    class="secondary-button"
                >
                    重新載入成員
                </button>
            </div>

            <div class="toolbar">
                <input
                    id="searchInput"
                    type="search"
                    placeholder="搜尋成員名稱"
                >

                <button
                    id="selectAllButton"
                    type="button"
                >
                    全選
                </button>

                <button
                    id="clearAllButton"
                    type="button"
                    class="secondary-button"
                >
                    全部取消
                </button>
            </div>

            <div class="summary">
                聯盟成員：
                <strong id="memberCount">
                    0
                </strong>
                人

                <span class="separator">｜</span>

                已選合格：
                <strong id="eligibleCount">
                    0
                </strong>
                人
            </div>

            <div
                id="loadingMessage"
                class="loading-message"
            >
                正在讀取成員名單……
            </div>

            <div
                id="memberList"
                class="member-list"
            ></div>
        </section>

<!-- 抽獎池預覽 -->
<section class="card">
    <div class="section-title">
        <div>
            <h2>抽獎池預覽</h2>
            <p>
                查看冷卻狀態、歷史中獎次數與本週權重
            </p>
        </div>

        <button
            id="previewPoolButton"
            type="button"
            class="secondary-button"
        >
            預覽抽獎池
        </button>
    </div>

    <div
        id="poolSummary"
        class="pool-summary hidden"
    >
        <div>
            <span>R4 勾選</span>
            <strong id="previewSelectedCount">0</strong>
        </div>

        <div>
            <span>冷卻中</span>
            <strong id="previewCoolingCount">0</strong>
        </div>

        <div>
            <span>實際可抽</span>
            <strong id="previewAvailableCount">0</strong>
        </div>

        <div>
            <span>權重總和</span>
            <strong id="previewWeightTotal">0</strong>
        </div>
    </div>

    <p
        id="previewMessage"
        class="message"
    ></p>

    <div
        id="previewLoading"
        class="loading-message hidden"
    >
        正在計算抽獎池……
    </div>

    <div
        id="poolPreviewList"
        class="pool-preview-list"
    ></div>
</section>
        
        <!-- 正式抽選 -->
        <section class="card">
            <div class="section-title">
                <div>
                    <h2>正式抽選</h2>
                    <p>
                        只會從已儲存的合格成員中抽選，完成後不能重抽
                    </p>
                </div>
            </div>

            <div class="draw-controls">
                <button
                    id="drawButton"
                    type="button"
                    class="draw-button"
                >
                    正式抽選
                </button>
            </div>

            <p id="drawMessage" class="message"></p>

            <div
                id="resultArea"
                class="result-area hidden"
            >
                <h3>🎉 本週抽選結果</h3>

                <ol id="resultList"></ol>

                <p
                    id="drawTime"
                    class="draw-time"
                ></p>
            </div>
        </section>
    </main>

    <footer>
        Sunrise Alliance
    </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="../shared/auth-helper.js"></script>
<script src="train.js"></script>
<script src="preview.js"></script>
</body>
</html>
